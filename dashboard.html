<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:#0A1628;

    font-family:'Outfit',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;

    color:#9aa7b4;
    margin-bottom:26px;
  }
  .spinner{
    width:34px;height:34px;
    margin:0 auto 26px;
    border:3px solid rgba(249,168,37,.22);
    border-top-color:#F9A825;
    border-radius:50%;
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  @media (prefers-reduced-motion: reduce){
    .spinner{animation:none;border-top-color:rgba(249,168,37,.22);}
  }
  a.btn{
    display:inline-block;
    background:#F9A825;
    color:#0A1628;
    font-weight:700;
    font-size:15px;
    text-decoration:none;
    padding:13px 26px;
    border-radius:8px;
    min-height:44px;
    line-height:1.3;
  }
  a.btn:focus-visible{outline:3px solid #fff;outline-offset:3px;}
  a.back{
    display:inline-block;
    margin-top:22px;
    color:#9aa7b4;
    font-size:13px;
    text-decoration:none;
    padding:10px;
  }
  a.back:hover,a.back:focus-visible{color:#fff;text-decoration:underline;}
