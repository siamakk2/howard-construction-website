<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0A1628">
<title>Site Manager AI &mdash; Howard Construction</title>

<!-- ============================================================
     SITE MANAGER APP LINK
     The Site Manager now runs on Orchamind. To change where this
     forwards, edit the ONE line below and nothing else.
       Login screen:  https://orchamind.com/app
       Sign-up form:  https://orchamind.com/app?signup=1
     ============================================================ -->
<meta http-equiv="refresh" content="0; url=https://orchamind.com/app">
<link rel="canonical" href="https://orchamind.com/app">
<link rel="icon" href="favicon.svg" type="image/svg+xml">

<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:#0A1628;
    color:#fff;
    font-family:'Outfit',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    text-align:center;
  }
  .card{max-width:420px;}
  .logo{height:52px;width:auto;margin-bottom:28px;}
  h1{
    font-size:22px;
    font-weight:600;
    letter-spacing:.2px;
    margin-bottom:10px;
  }
  p{
    font-size:15px;
    line-height:1.6;
    color:#9aa7b4;
    margin-bottom:26px;
  }
  .spinner{
    width:34px;height:34px;
    margin:0 auto 26px;
    border:3px solid rgba(249,168,37,.22);
    border-top-color:#F9A825;
    border-radius:50%;
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  @media (prefers-reduced-motion: reduce){
    .spinner{animation:none;border-top-color:rgba(249,168,37,.22);}
  }
  a.btn{
    display:inline-block;
    background:#F9A825;
    color:#0A1628;
    font-weight:700;
    font-size:15px;
    text-decoration:none;
    padding:13px 26px;
    border-radius:8px;
    min-height:44px;
    line-height:1.3;
  }
  a.btn:focus-visible{outline:3px solid #fff;outline-offset:3px;}
  a.back{
    display:inline-block;
    margin-top:22px;
    color:#9aa7b4;
    font-size:13px;
    text-decoration:none;
    padding:10px;
  }
  a.back:hover,a.back:focus-visible{color:#fff;text-decoration:underline;}
</style>
</head>
<body>
  <main class="card">
    <img src="logo.png" alt="Howard Construction" class="logo">
    <div class="spinner" aria-hidden="true"></div>
    <h1>Opening Site Manager AI&hellip;</h1>
    <p aria-live="polite">
      The Site Manager has moved to Orchamind. You&rsquo;ll be taken there
      automatically in a moment.
    </p>
    <a class="btn" href="https://orchamind.com/app">Open Site Manager AI</a>
    <br>
    <a class="back" href="index.html">&larr; Back to Howard Construction</a>
  </main>

<script>
  // Backup redirect in case the meta refresh is blocked.
  // Uses replace() so the Back button returns to the previous page,
  // not into a redirect loop.
  window.location.replace("https://orchamind.com/app");
</script>
</body>
</html>
